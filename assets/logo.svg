<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="WebScraperAgent">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- network nodes -->
  <circle cx="64" cy="38" r="7" fill="#fff" opacity="0.95"/>
  <circle cx="38" cy="64" r="6" fill="#fff" opacity="0.85"/>
  <circle cx="90" cy="64" r="6" fill="#fff" opacity="0.85"/>
  <circle cx="52" cy="88" r="5" fill="#fff" opacity="0.75"/>
  <circle cx="76" cy="88" r="5" fill="#fff" opacity="0.75"/>
  <!-- crawl links -->
  <g stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M64 45 L38 58"/>
    <path d="M64 45 L90 58"/>
    <path d="M38 70 L52 83"/>
    <path d="M90 70 L76 83"/>
    <path d="M52 88 L76 88"/>
  </g>
  <!-- agent bot head -->
  <rect x="48" y="52" width="32" height="24" rx="8" fill="#fff" opacity="0.98"/>
  <circle cx="57" cy="64" r="3.5" fill="#1e40af"/>
  <circle cx="71" cy="64" r="3.5" fill="#1e40af"/>
  <path d="M58 72 Q64 76 70 72" stroke="#1e40af" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- antenna -->
  <path d="M64 52 L64 45" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="64" cy="43" r="3" fill="#34d399"/>
</svg>
