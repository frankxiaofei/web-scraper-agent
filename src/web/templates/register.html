{% extends "base.html" %}
{% block title %}注册 — WebScraperAgent{% endblock %}
{% block head_extra %}
<style>
  .auth-card { max-width: 420px; margin: 4rem auto; }
</style>
{% endblock %}
{% block content %}
<div class="auth-card bg-white rounded-2xl shadow-lg border border-slate-200 p-8">
  <h2 class="text-2xl font-semibold text-slate-900 mb-2">注册</h2>
  <p class="text-sm text-slate-500 mb-6">创建账号以使用行业洞察 SaaS 功能</p>
  <form id="register-form" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="display_name">显示名称</label>
      <input id="display_name" name="display_name" type="text" autocomplete="name"
             class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-brand-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="email">邮箱</label>
      <input id="email" name="email" type="email" required autocomplete="email"
             class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-brand-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="password">密码</label>
      <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"
             class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-brand-500">
    </div>
    <p id="register-error" class="text-sm text-red-600 hidden"></p>
    <button type="submit" class="w-full rounded-lg bg-brand-600 text-white py-2.5 font-medium hover:bg-brand-700 transition">
      注册
    </button>
  </form>
  <p class="text-sm text-slate-500 mt-6 text-center">
    已有账号？<a href="/login" class="text-brand-600 hover:underline">登录</a>
  </p>
</div>
<script>
(function () {
  var form = document.getElementById('register-form');
  var errEl = document.getElementById('register-error');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errEl.classList.add('hidden');
    fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        display_name: document.getElementById('display_name').value.trim() || null
      })
    }).then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); })
      .then(function (res) {
        if (!res.ok) {
          errEl.textContent = typeof res.body.detail === 'string' ? res.body.detail : '注册失败';
          errEl.classList.remove('hidden');
          return;
        }
        if (res.body.access_token) {
          localStorage.setItem('access_token', res.body.access_token);
        }
        window.location.href = '/insights';
      })
      .catch(function () {
        errEl.textContent = '网络错误，请重试';
        errEl.classList.remove('hidden');
      });
  });
})();
</script>
{% endblock %}
