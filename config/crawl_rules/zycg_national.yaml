version: 1
site_id: zycg_national
name: 中央政府采购网
enabled: true
entry_url: https://www.zycg.gov.cn/freecms/site/zygjjgzfcgzx/cggg/index.html
list_page:
  strategy: dom
  container: '#TabContent .tab-pane.active ul#noticeShow'
  item: li
  title: a span
  link: a
  date: ''
pagination:
  type: next_button
  selector: button.turnPage.next-page
  disabled_selector: button.turnPage.next-page[disabled]
  url_style: query
  page_size: 15
  max_pages: 20
  stop_when_empty: true
  wait_after_ms: 2000
detail:
  fetch_detail: true
  strategy: dom
  url_pattern: /ggxx/info/
  content_selector: '#content'
  api_title_field: title
  api_id_param: id
limits:
  max_pages: 20
  max_items: 100
  max_depth: 2
  rate_limit_seconds: 2.0
