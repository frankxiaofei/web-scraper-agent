version: 1
site_id: 中国大唐集团有限公司_大唐集团电子商务平台
name: 大唐集团电子商务平台
enabled: true
entry_url: https://www.cdt-ec.com/notice/moreController/toMore?globleType=0
entry_steps:
  - action: navigate
    url: https://www.cdt-ec.com/notice/moreController/toMore?globleType=0
    label: 招标公告列表（toMore入口，layui table异步加载）
list_page:
  strategy: api
  container: "data"
  item: "."
  title: "message_title"
  link: "id"
  date: "publish_time"
  api:
    url: "https://www.cdt-ec.com/notice/moreController/getList"
    method: POST
    content_type: "application/x-www-form-urlencoded"
    headers:
      X-Requested-With: "XMLHttpRequest"
    body_template: "page={page}&limit={limit}&messagetype=0&message_title={keyword}&purchaser_company_name=&purchasing_agent_company=&purchase_order_no=&purchase_type=&inviteno=&tender_mode=&startDate=&endDate="
    page_param: "page"
    limit_param: "limit"
    default_limit: 20
    response_path: "$.data"
    total_path: "$.count"
detail:
  fetch_detail: true
  strategy: dom
  url_pattern: ".*"
  detail_url_template: "https://www.cdt-ec.com/notice/moreController/moreall?id={link}"
  content_selector: "body"
  title_selector: "h1, h2"
  wait_for: "body"
limits:
  max_pages: 50
  max_items: 1000
  max_depth: 2
  rate_limit_seconds: 1.5
search:
  enabled: true
  type: api
  details:
    api_body_override: "page=1&limit=20&messagetype=0&message_title=BIM&purchaser_company_name=&purchasing_agent_company=&purchase_order_no=&purchase_type=&inviteno=&tender_mode=&startDate=&endDate="
