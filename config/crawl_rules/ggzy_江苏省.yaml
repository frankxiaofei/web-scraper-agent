version: 1
site_id: ggzy_江苏省
name: 江苏省公共资源交易平台
enabled: true
entry_url: http://jsggzy.jszwfw.gov.cn/jyxx/tradeInfonew.html?type=jsgc
entry_steps:
  - action: navigate
    url: http://jsggzy.jszwfw.gov.cn/jyxx/tradeInfonew.html?type=jsgc
  - action: wait
    timeout_ms: 5000
# 列表页：江苏 ggzy 的 jyxx 公告链接结构
list_page:
  strategy: dom
  container: "body"
  item: "a[href*='/jyxx/']"
  title: "self"
  link: "self"
  wait_for: "a[href*='/jyxx/']"
pagination:
  type: page_button
  selector: "a[href*='pageNo='], a[href*='page='], .pagination a"
  wait_after_ms: 2000
detail:
  fetch_detail: true
  strategy: dom
  url_pattern: "/jyxx/"
  content_selector: ".ewb-trade-mid, .detail_content, .detailContent, .article-content, .content, #detail_content, .detail-content, .fully_toggle_cont, .main-content, .right-content"
  title_selector: "h4.h4_o, .detail_title, .article-title, h1.title, .title h1, h1, h2"
  wait_for: ".ewb-trade-mid, h4.h4_o, .detail_content, .detailContent, .article-content, .fully_toggle_cont"
limits:
  max_pages: 10
  max_items: 100
  max_depth: 2
  rate_limit_seconds: 2.0
